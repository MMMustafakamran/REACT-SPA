# Let dependency install scripts run, the way npm and yarn already do here.
#
# pnpm 10 stopped running dependency lifecycle scripts unless each package is
# approved, and pnpm exits NON-ZERO after printing ERR_PNPM_IGNORED_BUILDS.
# `pnpm install` therefore failed on this scaffold -- esbuild (via vite) and
# @scarf/scarf both have install scripts -- and it failed *after* printing
# "dependencies: + @copilotkit/react-core ... done", so the log read like a
# clean install right up to the exit code. That killed the pnpm track of every
# CI run this pipeline has made.
#
# Why allow-all rather than an `allowBuilds:` allowlist: the npm and yarn tracks
# run these same scripts unrestricted, because that is what `npm install` and
# `yarn install` do. Approving a hand-kept list only under pnpm would mean the
# three tracks no longer install the same tree, which is the point of running
# three. It would also need re-approving whenever a transitive dependency adds
# an install script -- breaking the nightly for a reason unrelated to the page.
#
# Why here and not in package.json: the three scaffolds' package.json files are
# byte-identical transcriptions of what the quickstart tells a reader to create,
# and a pnpm-only key in one of them would break that. pnpm 11 writes its own
# settings to this file, so this is where the setting belongs.
#
# For the doc review: a reader on the quickstart's pnpm tab running pnpm 10 or
# newer hits this failure too, and the page says nothing about it.
dangerouslyAllowAllBuilds: true
